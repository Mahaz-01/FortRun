name: fortrun
description: "A gamified running app based in Islamabad, featuring territory capture and sabotage."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Supabase — Auth, Database (PostgreSQL), Realtime, Storage
  supabase_flutter: ^2.5.0

  # Environment Variables
  flutter_dotenv: ^5.1.0

  # State Management
  provider: ^6.1.2

  # Location & Maps
  google_maps_flutter: ^2.7.0
  geolocator: ^12.0.0
  location: ^6.0.2
  flutter_polyline_points: ^2.0.0

  # Local Storage & Utilities
  shared_preferences: ^2.3.1
  uuid: ^4.4.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
