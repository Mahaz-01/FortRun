name: fortrun
description: "FortRun — Gamified territory running app for Pakistan. Claim sectors, invade rivals, build your empire."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Backend — Supabase Auth, PostgreSQL, Realtime
  supabase_flutter: ^2.5.0

  # Environment Variables
  flutter_dotenv: ^5.1.0

  # State Management
  provider: ^6.1.2

  # Maps (free, no API key required)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Location & GPS
  geolocator: ^12.0.0

  # Networking (OSM Overpass API for dynamic restaurants)
  http: ^1.2.0

  # Typography
  google_fonts: ^6.2.1

  # Sharing (run cards to WhatsApp/Instagram)
  share_plus: ^10.0.0

  # Local Storage & Utilities
  shared_preferences: ^2.3.1
  uuid: ^4.4.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - env
